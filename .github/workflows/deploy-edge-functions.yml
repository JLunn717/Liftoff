name: Deploy Liftoff Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/notification-dispatch/**"
      - "supabase/config.toml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Liftoff
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Deploy notification dispatcher
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy notification-dispatch --project-ref uwfzodvfjdstnckroadu --no-verify-jwt
