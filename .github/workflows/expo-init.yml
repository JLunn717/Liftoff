name: Register Liftoff with Expo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Liftoff
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create or link the Expo project
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest init --account jlunn717 --non-interactive --json

      - name: Save the Expo project ID to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json
          if git diff --cached --quiet; then
            echo "Expo project configuration is already committed."
          else
            git commit -m "chore: link Liftoff mobile app to Expo"
            git push
          fi
