name: Liftoff Android Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Liftoff
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13

      - name: Install monorepo dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo project
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Inject Supabase client configuration
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node -e 'const fs = require("node:fs"); const config = { url: process.env.SUPABASE_URL, anonKey: process.env.SUPABASE_ANON_KEY }; if (!config.url || !config.anonKey) throw new Error("Missing Supabase public client configuration."); fs.writeFileSync("supabase.config.ts", `export const SUPABASE_CONFIG = ${JSON.stringify(config)} as const\\n`);'

      - name: Build installable Android preview
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
